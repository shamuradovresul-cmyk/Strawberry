version: "3.9"

services:

  # ─── Local Telegram Bot API Server ───────────────────────────────────────────
  # Removes all file-size limits (default Bot API caps at 50 MB).
  # Requires TELEGRAM_API_ID and TELEGRAM_API_HASH from https://my.telegram.org
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
    # API server data lives on a tmpfs mount — RAM only, no disk writes
    tmpfs:
      - /var/lib/telegram-bot-api:size=8g
    ports:
      - "8081:8081"

  # ─── Subtitle Bot ─────────────────────────────────────────────────────────────
  subtitle-bot:
    build: .
    restart: unless-stopped
    depends_on:
      - telegram-bot-api
    environment:
      BOT_TOKEN: "${BOT_TOKEN}"
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
      LOCAL_API_URL: "http://telegram-bot-api:8081"
      WHISPER_MODEL: "${WHISPER_MODEL:-medium}"
      MAX_VIDEO_DURATION: "${MAX_VIDEO_DURATION:-5400}"
      TEMP_DIR: "/dev/shm/subtitle_bot"
    # All temporary video/audio/SRT files live in RAM via /dev/shm
    shm_size: "8gb"
    volumes:
      - /dev/shm:/dev/shm
