version: "3.9"

# Только Local Telegram Bot API Server — снимает лимит 50 МБ на файлы.
# Python бот запускается отдельно через venv (экономит RAM).

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
    volumes:
      # Данные API сервера хранятся на диске (не в RAM)
      - ./telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      # Слушаем только на localhost — снаружи не доступен
      - "127.0.0.1:8081:8081"
